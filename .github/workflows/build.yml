name: Build DEB

on:
  push:
    tags:
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          brew install ldid dpkg 2>/dev/null || true

      - name: 安装 Theos
        run: |
          export THEOS=/tmp/theos
          echo "THEOS=/tmp/theos" >> $GITHUB_ENV
          git clone --recursive --depth 1 https://github.com/theos/theos.git $THEOS

      - name: 编译
        run: make package DEBUG=0
        env:
          THEOS: /tmp/theos

      - name: 上传 DEB (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: mc-tweak-deb
          path: packages/*.deb
          retention-days: 30

      - name: 发布 Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true